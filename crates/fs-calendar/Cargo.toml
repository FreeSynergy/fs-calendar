[package]
name = "fs-calendar"
description = "FreeSynergy.Calendar: one program, one command (ADR 0063): the window, `serve`, and the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-calendar"
path = "src/main.rs"

[features]
default = ["gui"]
# The window. Servers and machines without a screen build with --no-default-features.
gui = ["dep:fs-calendar-app"]

[dependencies]
fs-calendar-server = { path = "../fs-calendar-server" }
fs-calendar-cli = { path = "../fs-calendar-cli" }
fs-calendar-app = { path = "../fs-calendar-app", optional = true }

[dev-dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.45.0", features = ["rpc"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
