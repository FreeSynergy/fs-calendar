[package]
name = "fs-calendar-app"
description = "The calendar program of FreeSynergy, first window: month, week, day and agenda; create, edit and delete events; iCalendar in and out; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fs-calendar-core = { path = "../fs-calendar-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# The calendar server and the tasks of a day, over their sockets (ADR 0021); no code of another program.
fs-calendar-client = { path = "../fs-calendar-client" }
# To cut an iCalendar file into its tasks; the same tag as the core.
fs-jscalendar = { git = "https://github.com/FreeSynergy/fs-jscalendar", tag = "v0.0.1" }
# provisional: becomes a tag once reviewed
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.1" }
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.1" }
# To read what an import was given; the same exact pin as fs-jscalendar: later releases are AGPL.
calcard = "=0.3.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
fs-calendar-server = { path = "../fs-calendar-server" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.1", features = ["rpc"] }
tempfile = "3"
# provisional: becomes a tag once reviewed
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.1" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
