[package]
name = "fs-calendar-app"
description = "The calendar program of FreeSynergy, first window: month, week, day and agenda; create, edit and delete events; iCalendar in and out; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fs-calendar-core = { path = "../fs-calendar-core" }
# The task program behind the calendar's two small traits; `local`: the task store is in this process.
fs-calendar-tasks = { path = "../fs-calendar-tasks", features = ["local"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
# Tasks belong to fs-tasks (ADR 0050); shown here read-only through the TaskItems interface.
fs-tasks-core = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.9.0" }
# provisional: becomes a tag once reviewed
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "1b981c729cb9c64d0825bc3697341c4b4b892adf" }
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "1b981c729cb9c64d0825bc3697341c4b4b892adf" }
# To read what an import was given; the same exact pin as fs-jscalendar: later releases are AGPL.
calcard = "=0.3.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# provisional: becomes a tag once reviewed
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", rev = "1b981c729cb9c64d0825bc3697341c4b4b892adf" }
async-trait = "0.1"
