[package]
name = "fs-calendar-app"
description = "The calendar program of FreeSynergy, first window: month, week, day and agenda; create, edit and delete events; iCalendar in and out; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fs-calendar-core = { path = "../fs-calendar-core" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
# Tasks belong to fs-tasks (ADR 0050); shown here read-only through the TaskItems interface.
fs-tasks-core = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.4.1" }
# provisional: becomes a tag once reviewed
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "360ef92efc2f9439e7cd57db1136fe67fd39981c" }
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "360ef92efc2f9439e7cd57db1136fe67fd39981c" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# provisional: becomes a tag once reviewed
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", rev = "360ef92efc2f9439e7cd57db1136fe67fd39981c" }
async-trait = "0.1"
