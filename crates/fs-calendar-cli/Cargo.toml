[package]
name = "fs-calendar-cli"
description = "Command line of FreeSynergy calendar: a second user of events.capnp, next to the MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_calendar_cli"

[dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.45.0", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
capnp = "0.27"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
fs-calendar-core = { path = "../fs-calendar-core" }
fs-calendar-server = { path = "../fs-calendar-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
