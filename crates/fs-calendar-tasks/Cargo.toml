[package]
name = "fs-calendar-tasks"
description = "The calendar's task program as seen over tasks.capnp: TasksInWindow and TaskIntake of fs-calendar-core over a Unix socket, with no task crate of fs-tasks in the graph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# In-process adapter over `TaskItems` of fs-tasks-core, for a program that holds the task store itself.
local = ["dep:fs-tasks-core"]

[dependencies]
fs-calendar-core = { path = "../fs-calendar-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.45.0", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
# Tasks belong to fs-tasks (ADR 0050); only with the feature `local`, and never in the core.
fs-tasks-core = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.8.0", optional = true }
capnp = "0.27"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }

[dev-dependencies]
fs-tasks-core = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.8.0", features = ["contract"] }
fs-tasks-server = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.8.0" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
