[package]
name = "fs-calendar-core"
description = "Program core of FreeSynergy calendar: JSCalendar 2.0 events and tasks over fs-store, recurrence, invitations, iCalendar import/export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store = { path = "/srv/FreeSynergy/fs-store/crates/fs-store" }
# Last MIT/Apache version before Stalwart moved later releases to AGPL: pinned exactly (see DESIGN.md).
calcard = "=0.3.14"
rrule = "0.14"
chrono-tz = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
