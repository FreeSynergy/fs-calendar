[package]
name = "fs-calendar-core"
description = "Program core of FreeSynergy calendar: JSCalendar 2.0 events over fs-store (tasks via the fs-tasks interface), recurrence, invitations, iCalendar import/export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
# Tasks belong to fs-tasks (ADR 0050); the calendar uses the TaskItems trait only.
fs-tasks-core = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.4.1" }
# The contract and the provider rule (ADR 0045).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.5.0" }
# Shared JSCalendar types (time, rule, participants, upgrade, validation, iCalendar); Event itself is ours (ADR 0050).
fs-jscalendar = { git = "https://github.com/FreeSynergy/fs-jscalendar", tag = "v0.1.0" }
rrule = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
