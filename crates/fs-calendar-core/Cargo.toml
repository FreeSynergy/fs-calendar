[package]
name = "fs-calendar-core"
description = "Program core of FreeSynergy calendar: JSCalendar 2.0 events over fs-objects (tasks only through two small traits, no tasks crate), recurrence, invitations, iCalendar import/export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Cap'n Proto contract: the schema and generated code live in fs-interfaces (ADR 0045).
contract = ["dep:capnp"]

[dependencies]
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# The contract and the provider rule (ADR 0045).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11" }
# The type description (ADR 0066): the same tag as the contract, so the server reports it without a converter.
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11" }
# Shared JSCalendar types (time, rule, participants, upgrade, validation, iCalendar); Event itself is ours (ADR 0050).
fs-jscalendar = { git = "https://github.com/FreeSynergy/fs-jscalendar", tag = "v0.0.1" }
rrule = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
capnp = { version = "0.27", optional = true }
# To tell which zone an iCalendar file names; the same exact pin as fs-jscalendar: later releases are AGPL.
calcard = "=0.3.14"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
tempfile = "3"
