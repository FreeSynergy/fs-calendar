[package]
name = "fs-calendar-client"
description = "Client of the calendar contract (events.capnp): Calendar of fs-calendar-core over a Unix socket, and the tasks of a day from tasks.capnp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-calendar-core = { path = "../fs-calendar-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.36.0", features = ["rpc"] }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
capnp = "0.27"
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }

[dev-dependencies]
fs-calendar-server = { path = "../fs-calendar-server" }
# The real tasks server, to prove the tasks of a day against it; only tests see it.
fs-tasks-server = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.6.0" }
fs-tasks-core = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.6.0" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
